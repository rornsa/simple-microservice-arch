[project]
name = "payment-service"
version = "0.1.0"
description = "Payment processing microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.6.1",
    "connectrpc>=0.10.0",
    "fastapi[standard]>=0.133.1",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.47",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

